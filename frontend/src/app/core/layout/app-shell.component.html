<div class="shell" [class.shell--collapsed]="sidebarCollapsed()">
  <aside class="shell__sidebar">
    <div class="shell__brand">
      <div class="shell__brand-mark">A</div>
      <div>
        <div class="shell__brand-name">AssistDoc</div>
        <div class="shell__brand-subtitle">{{ tenant()?.name }}</div>
      </div>
    </div>

    <nav class="shell__nav">
      <a class="shell__nav-item" routerLink="/" routerLinkActive="shell__nav-item--active" [routerLinkActiveOptions]="{ exact: true }">Chat</a>
      <a class="shell__nav-item" routerLink="/documents" routerLinkActive="shell__nav-item--active">Documenti</a>
      <a *ngIf="canViewAudit()" class="shell__nav-item" routerLink="/audit" routerLinkActive="shell__nav-item--active">Audit</a>
    </nav>
  </aside>

  <main class="shell__main">
    <header class="shell__header">
      <div class="shell__header-title">
        <button
          class="shell__toggle"
          type="button"
          (click)="toggleSidebar()"
          [attr.aria-label]="sidebarCollapsed() ? 'Mostra pannello laterale' : 'Nascondi pannello laterale'"
          [attr.title]="sidebarCollapsed() ? 'Mostra pannello laterale' : 'Nascondi pannello laterale'"
        >
          <i class="bi" [ngClass]="sidebarCollapsed() ? 'bi-layout-sidebar-inset-reverse' : 'bi-layout-sidebar-inset'"></i>
          <span class="visually-hidden">{{ sidebarCollapsed() ? 'Mostra pannello laterale' : 'Nascondi pannello laterale' }}</span>
        </button>
        <div>
          <h1>Assistente documentale privato</h1>
          <p>Risposte contestuali solo dai documenti del tenant.</p>
        </div>
      </div>
      <div class="shell__user">
        <div class="shell__avatar">{{ initials() }}</div>
        <div>
          <div>{{ session()?.user?.fullName }}</div>
          <small>{{ session()?.user?.role }}</small>
        </div>
        <button type="button" (click)="signOut()">Esci</button>
      </div>
    </header>

    <p *ngIf="feedback()" class="shell__feedback">{{ feedback() }}</p>

    <router-outlet />
  </main>
</div>
