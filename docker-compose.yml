services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    working_dir: /app/backend
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      TOKEN_SECRET: assistdoc-dev-secret
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: assistdoc
      DB_USERNAME: assistdoc
      DB_PASSWORD: assistdoc
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - mysql
      - qdrant
      - ollama

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    working_dir: /app/backend
    volumes:
      - ./:/app
    command: php artisan queue:work
    environment:
      APP_ENV: local
      TOKEN_SECRET: assistdoc-dev-secret
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: assistdoc
      DB_USERNAME: assistdoc
      DB_PASSWORD: assistdoc
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    working_dir: /app/frontend
    volumes:
      - ./:/app
    ports:
      - "4200:4200"
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: assistdoc
      MYSQL_USER: assistdoc
      MYSQL_PASSWORD: assistdoc
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.6.6
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  mysql-data:
  qdrant-data:
  ollama-data:
