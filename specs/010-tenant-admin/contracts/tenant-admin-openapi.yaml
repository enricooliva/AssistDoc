openapi: 3.0.3
info:
  title: Tenant Administration API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /tenants:
    get:
      summary: List tenants for super-admin review
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant list
    post:
      summary: Create a tenant and its initial admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
      responses:
        '201':
          description: Tenant created
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /tenants/{tenantId}:
    get:
      summary: Show tenant summary and membership overview
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant detail
        '404':
          description: Tenant not found
  /tenants/{tenantId}/users:
    post:
      summary: Add a user to an existing tenant
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
      requestBody:
        required: true
      responses:
        '201':
          description: User created
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Tenant not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
