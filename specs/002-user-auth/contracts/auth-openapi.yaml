openapi: 3.1.0
info:
  title: AssistDoc Authentication API
  version: 1.0.0
  description: Tenant-aware authentication contract for AssistDoc.
servers:
  - url: http://localhost:8000
tags:
  - name: Authentication
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with local development credentials
      description: Authenticates a user and returns a tenant-scoped access context.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Credentials are invalid or the session cannot be granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out the current authenticated client
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session invalidated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Caller is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user context
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user context returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Caller is not authenticated or token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: User email within the tenant directory.
        password:
          type: string
          format: password
          minLength: 8
          description: Secret used for local-development authentication.
    AuthSuccessResponse:
      type: object
      required: [token, token_type, expires_in, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/AuthenticatedUserContext'
    CurrentUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUserContext'
    LogoutResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          enum: [Logout completed]
    AuthenticatedUserContext:
      type: object
      required:
        [id, full_name, email, tenant, role]
      properties:
        id:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
        tenant:
          $ref: '#/components/schemas/TenantSummary'
        role:
          type: string
          enum: [super-admin, operator, viewer]
    TenantSummary:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNAUTHENTICATED, ACCESS_DENIED]
            message:
              type: string
    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED]
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
